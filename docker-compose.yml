version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: morpheus-postgres
    environment:
      POSTGRES_DB: morpheus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: morpheus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: morpheus
      RABBITMQ_DEFAULT_PASS: morpheuspassword
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 15s
      retries: 5

volumes:
  postgres_data:
